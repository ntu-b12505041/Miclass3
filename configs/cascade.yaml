seed: 42

data:
  source: ptb-xl-1.0.3
  data_dir: data/ptbxl
  waveform_normalization: per_lead_zscore
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]

architecture:
  stage1:
    width: 64
    block_dropout: 0.10
  stage2:
    width: 64
    block_dropout: 0.10
    fusion_dropout: 0.25

training:
  batch_size: 32
  epochs: 40
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 8
  num_workers: 0
  grad_clip_norm: 1.0

  # Stage 1 already separates MI from non-MI well, so keep moderate weighting.
  stage1_class_weight_power: 0.5

  # Stage 2 has a much rarer STEMI-proxy positive class; stronger weighting
  # helps the conditional classifier pay attention to it.
  stage2_class_weight_power: 0.8

  # Fit morphology scaling only on fold 1-8 MI records used by stage 2.
  feature_transform:
    clip: 6.0
    add_missing_indicators: true

cascade:
  # Stage 1: all records, target = MI (STEMI-proxy or NSTEMI-proxy) vs non-MI.
  stage1_name: mi_vs_non_mi

  # The gate is intentionally recall-oriented. A false negative here can never
  # be recovered by stage 2, whereas a false positive can still be classified
  # downstream. Threshold selection remains validation-only (fold 9).
  stage1_minimum_recall: 0.90

  # Stage 2: only true MI records during training, target = STEMI-proxy vs
  # NSTEMI-proxy. Use waveform + morphology fusion rather than waveform-only.
  stage2_name: stemi_vs_nstemi
  stage2_model: morphology_fusion
  stage2_feature_profile: core
  stage2_minimum_recall: null

  # literal_hard_gate reproduces the requested sequential decision flow.
  # Soft hierarchical probabilities are also exported for analysis.
  routing_mode: literal_hard_gate

output:
  # Keep v1 artifacts intact for direct comparison.
  out_dir: artifacts/cascade_v2
