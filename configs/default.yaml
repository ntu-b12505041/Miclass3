seed: 42
data:
  source: ptb-xl-1.0.3
  data_dir: data/ptbxl
  sampling_rate: 500
  lead_mode: all12
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]
labels:
  old_mi_policy: exclude
  require_morphology_for_stemi: true
models:
  # Run one primary model; these are the only recommended candidates.
  primary: morphology_fusion
  candidates: [morphology_fusion, inceptiontime, seresnet]
training:
  batch_size: 32
  epochs: 40
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 8
  num_workers: 0
  auxiliary_weight: 0.25
  # Extra hierarchical task: MI (NSTEMI/STEMI proxy) vs non-MI.  It helps
  # separate the two classes that are currently most often confused.
  mi_auxiliary_weight: 0.15
  lbbb_auxiliary_weight: 0.05
  # Use a deterministic training-only sub-sample of non_mi.  The reference
  # class is nstemi_proxy (label 2), so non_mi is capped at 2:1 relative to
  # it.  Validation/test remain untouched and STEMI is still handled by the
  # square-root sampler below.
  majority_subsample:
    enabled: true
    majority_label: 0
    reference_label: 2
    max_ratio: 2.0
  # Moderate class-aware oversampling: reduces empty-STEMI batches without
  # repeatedly copying the 744 STEMI-proxy records into every batch.
  sampling_strategy: sqrt
  sampling_power: 0.5
  # Use softened inverse-frequency weights with the sampler.  Combining full
  # inverse-frequency sampling and full inverse-frequency loss overcorrects.
  class_weight_power: 0.5
  # The auxiliary STEMI head uses a softened positive weight when sampling is
  # enabled; this keeps it from being dominated by negatives without creating
  # an excessively high positive gradient.
  auxiliary_pos_weight_power: 0.5
metrics:
  selection_metric: val_macro_auprc
  calibrate_stemi_threshold: true
  report: [macro_auroc, macro_auprc, macro_f1, balanced_accuracy, stemi_recall]
