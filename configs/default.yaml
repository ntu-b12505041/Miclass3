seed: 42
data:
  source: ptb-xl-1.0.3
  data_dir: data/ptbxl
  sampling_rate: 500
  lead_mode: all12
  # Baseline preserves the repository's original per-lead z-score path.
  # Tuning compares a global-scale alternative that retains lead amplitudes.
  waveform_normalization: per_lead_zscore
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]
labels:
  # The implementation maps the completed/old category Stadium III to this
  # exclusion policy; Stadium II-III remains in the primary cohort.
  old_mi_policy: exclude
  require_morphology_for_stemi: true
models:
  # Run one primary model; these are the only recommended candidates.
  primary: morphology_fusion
  candidates: [morphology_fusion, inceptiontime, seresnet]
  architecture:
    width: 64
    block_dropout: 0.10
    fusion_dropout: 0.25
training:
  batch_size: 32
  epochs: 40
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 8
  num_workers: 0
  auxiliary_weight: 0.35
  # `extended` adds non-target-leaking morphology, timing, age/sex and
  # lead-specific ECG features. It is compared in configs/tuning.yaml.
  feature_profile: core
  # Direct LBBB/mSgarbossa routing flags participate in proxy-label creation,
  # so the primary classifier does not receive them. Enable only for the
  # pre-specified routing-flag ablation.
  include_label_routing_flags: false
  classification_loss: cross_entropy
  label_smoothing: 0.0
  focal_gamma: 1.5
  # Extra hierarchical task: MI (NSTEMI/STEMI proxy) vs non-MI.  It helps
  # separate the two classes that are currently most often confused.
  mi_auxiliary_weight: 0.25
  lbbb_auxiliary_weight: 0.05
  # Use a deterministic training-only sub-sample of non_mi.  The reference
  # class is nstemi_proxy (label 2), so non_mi is capped at 2:1 relative to
  # it.  Validation/test remain untouched and STEMI is still handled by the
  # square-root sampler below.
  majority_subsample:
    enabled: true
    majority_label: 0
    reference_label: 2
    max_ratio: 2.0
  # Moderate class-aware oversampling: reduces empty-STEMI batches without
  # repeatedly copying the 744 STEMI-proxy records into every batch.
  sampling_strategy: sqrt
  sampling_power: 0.5
  # Use softened inverse-frequency weights with the sampler.  Combining full
  # inverse-frequency sampling and full inverse-frequency loss overcorrects.
  class_weight_power: 0.8
  # The auxiliary STEMI head uses a softened positive weight when sampling is
  # enabled; this keeps it from being dominated by negatives without creating
  # an excessively high positive gradient.
  auxiliary_pos_weight_power: 0.8
  # Fit robust continuous-feature scaling on folds 1-8 only. Any binary input
  # retained in an ablation stays 0/1; missingness is explicit.
  feature_transform:
    clip: 6.0
    add_missing_indicators: true
  # Reduce the learning rate only when validation macro-AUPRC has stopped
  # improving. Early stopping uses the same validation-only metric.
  lr_scheduler:
    enabled: true
    factor: 0.5
    patience: 3
    min_lr: 0.00001
metrics:
  selection_metric: val_macro_auprc
  calibrate_stemi_threshold: true
  # Leave this null for the macro-F1 optimum. Set a validation-only recall
  # floor (for example 0.75) in a comparison run when STEMI sensitivity is the
  # operational priority; test labels must never choose this value.
  stemi_threshold:
    minimum_stemi_recall: null
  report: [macro_auroc, macro_auprc, macro_f1, balanced_accuracy, stemi_recall]
